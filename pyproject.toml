[project]
name = "observability"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "dependency-injector>=4.49.1",
    "faker>=40.23.0",
    "fastapi>=0.138.1",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-logging>=0.64b0",
    "opentelemetry-instrumentation-openai>=0.62.1",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
    "opentelemetry-sdk>=1.43.0",
    "pre-commit>=4.6.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.20",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
